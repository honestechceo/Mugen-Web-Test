<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><meta name="apple-mobile-web-app-capable" content="yes"><title>HONESTECH MUGEN | Arcade Control Lab</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;--gold:#d7ad52;--ink:#080b13}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--ink);color:#fff}body{overscroll-behavior:none}.app{height:100dvh;min-height:340px;display:flex;flex-direction:column;overflow:hidden}.top{flex:none;min-height:49px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px max(12px,env(safe-area-inset-right)) 7px max(12px,env(safe-area-inset-left));background:#101521;border-bottom:1px solid #66552f}.brand{font-weight:950;letter-spacing:.11em;font-size:clamp(13px,2.4vw,23px);white-space:nowrap}.brand b{color:var(--gold)}.actions{display:flex;align-items:center;gap:6px}.actions button{font:700 clamp(10px,1.4vw,13px) system-ui;background:#202839;color:#fff;border:1px solid #88703c;border-radius:7px;padding:7px 10px;white-space:nowrap}.actions button[aria-pressed=true]{background:var(--gold);color:#0b0d12}.actions .fs{font-size:17px;padding:3px 10px}.arena{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate;touch-action:none;background:radial-gradient(ellipse at 52% 37%,#354a66 0%,#19263a 48%,#090f1d 95%)}.arena:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(0deg,#05080ec7,transparent 30%),repeating-linear-gradient(0deg,transparent 0 4px,#0002 5px 6px);opacity:.5}.scene{position:absolute;inset:5% 17% 12%;display:flex;align-items:center;flex-direction:column;pointer-events:none}.logo{font-weight:1000;font-size:clamp(18px,5.3vw,68px);font-style:italic;letter-spacing:-.045em;white-space:nowrap;text-shadow:3px 4px #0009}.logo b{color:var(--gold)}.sub{font-size:clamp(8px,1.1vw,13px);letter-spacing:.3em;color:#e5d0a0}.menu{margin:auto 0;display:grid;gap:clamp(2px,.8vh,9px);text-align:center;font-size:clamp(13px,2.1vw,28px);font-weight:950;font-style:italic;text-shadow:2px 3px #000a}.menu div:first-child{color:var(--gold)}.joystick{position:absolute;left:max(3%,env(safe-area-inset-left));bottom:8%;height:min(39%,32vw);aspect-ratio:1;border:3px solid #a7b0c3;border-radius:50%;background:#0a1323ad;display:grid;place-items:center;box-shadow:inset 0 0 30px #0007;touch-action:none}.knob{height:43%;aspect-ratio:1;border-radius:50%;background:linear-gradient(140deg,#53637b,#111927);border:2px solid var(--gold);transform:translate(var(--dx,0px),var(--dy,0px));pointer-events:none}.fightbuttons{position:absolute;right:max(3%,env(safe-area-inset-right));bottom:7%;width:min(39%,39vw);height:52%}.attack{position:absolute;width:21%;aspect-ratio:1;border:2px solid var(--gold);border-radius:50%;background:#172033d9;color:#fff;font-size:clamp(12px,2vw,22px);font-weight:900;touch-action:none;user-select:none}.attack.pressed,.utility.pressed{background:var(--gold);color:#080b13;transform:scale(.95)}.attack[data-key=X]{left:0;top:30%}.attack[data-key=Y]{left:26%;top:10%}.attack[data-key=Z]{left:52%;top:0}.attack[data-key=W]{left:78%;top:12%}.attack[data-key=A]{left:0;top:73%}.attack[data-key=B]{left:26%;top:53%}.attack[data-key=C]{left:52%;top:43%}.attack[data-key=D]{left:78%;top:55%}.compact .attack:not([data-key=A]):not([data-key=B]){display:none}.compact .fightbuttons{width:min(29%,27vw);height:38%;bottom:9%}.compact .attack[data-key=A]{left:5%;top:48%;width:35%}.compact .attack[data-key=B]{left:55%;top:10%;width:35%}.utilities{position:absolute;bottom:3%;left:43%;display:flex;gap:8px}.utility{background:#101724dd;color:#fff;border:1px solid var(--gold);border-radius:8px;padding:7px 13px;font-size:clamp(11px,1.4vw,16px);font-weight:800;touch-action:none}.status{flex:none;min-height:30px;padding:6px 14px;background:#101521;color:#d9bd7a;font-size:12px;text-align:center}.note{display:none}.rotate{display:none}@media(orientation:portrait){.arena{min-height:0}.scene{inset:10% 12% 30%}.logo{font-size:clamp(19px,6vw,40px)}.menu{font-size:clamp(14px,3.4vw,23px)}.joystick{height:auto;width:34%;bottom:8%}.fightbuttons{width:44%;height:29%;bottom:9%}.compact .fightbuttons{width:38%;height:25%}.utilities{left:39%;bottom:3%}.top{flex-wrap:wrap;justify-content:center}.rotate{display:block;position:absolute;top:5px;left:0;right:0;text-align:center;color:#d8c184;font-size:11px;pointer-events:none}}@media(max-height:430px){.top{min-height:38px;padding-top:3px;padding-bottom:3px}.scene{inset:2% 20% 7%}.joystick{height:67%;width:auto;bottom:5%}.fightbuttons{height:82%;width:33%;bottom:5%}.compact .fightbuttons{height:60%;width:22%;bottom:9%}.utilities{bottom:3%}.logo{font-size:clamp(17px,4vw,35px)}.menu{font-size:clamp(12px,2vw,20px)}.status{min-height:22px;padding:3px}}@media(max-width:450px){.brand{font-size:12px}.actions button{padding:6px;font-size:10px}.actions .fs{font-size:14px}.utilities{gap:4px}.utility{padding:5px 7px}}
</style></head><body><div class="app"><header class="top"><div class="brand">HONESTECH <b>MUGEN</b></div><div class="actions"><button id="menuMode" aria-pressed="true">MENU</button><button id="fightMode" aria-pressed="false">FIGHT</button><button id="reset">RESET</button><button id="fullscreen" class="fs" aria-label="Fullscreen">⛶</button></div></header><main class="arena compact" id="arena"><div class="rotate">Rotate your phone for the best arcade view</div><div class="scene"><div class="logo">HONESTECH <b>MUGEN</b></div><div class="sub">ARCADE CONTROL LAB</div><div class="menu"><div>ARCADE</div><div>VS MODE</div><div>NETWORK</div><div>PRACTICE</div><div>MISSION</div></div></div><div class="joystick" id="joystick" aria-label="Touch joystick"><div class="knob" id="knob"></div></div><div class="fightbuttons"><button class="attack" data-key="X">X</button><button class="attack" data-key="Y">Y</button><button class="attack" data-key="Z">Z</button><button class="attack" data-key="W">W</button><button class="attack" data-key="A">A</button><button class="attack" data-key="B">B</button><button class="attack" data-key="C">C</button><button class="attack" data-key="D">D</button></div><div class="utilities"><button class="utility" data-key="Start">START</button><button class="utility" data-key="Menu">MENU</button></div></main><div class="status" id="status" aria-live="polite">MENU MODE • Touch the controls to test placement</div></div><script>
const arena=document.getElementById('arena'),status=document.getElementById('status'),knob=document.getElementById('knob'),stick=document.getElementById('joystick');function setMode(fight){arena.classList.toggle('compact',!fight);document.getElementById('menuMode').setAttribute('aria-pressed',String(!fight));document.getElementById('fightMode').setAttribute('aria-pressed',String(fight));status.textContent=(fight?'FIGHT':'MENU')+' MODE • Touch the controls to test placement'}document.getElementById('menuMode').onclick=()=>setMode(false);document.getElementById('fightMode').onclick=()=>setMode(true);document.getElementById('reset').onclick=()=>{setMode(false);center()};document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(arena.requestFullscreen)await arena.requestFullscreen();else status.textContent='Safari: use Add to Home Screen for a more immersive view'}catch(e){status.textContent='Fullscreen unavailable in this browser'}};document.querySelectorAll('[data-key]').forEach(btn=>{btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);btn.classList.add('pressed');status.textContent='Pressed: '+btn.dataset.key});for(const event of ['pointerup','pointercancel','lostpointercapture'])btn.addEventListener(event,()=>btn.classList.remove('pressed'))});function center(){knob.style.setProperty('--dx','0px');knob.style.setProperty('--dy','0px')}function move(e){const r=stick.getBoundingClientRect(),lim=r.width*.27,dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy)||1,scale=Math.min(1,lim/len);knob.style.setProperty('--dx',dx*scale+'px');knob.style.setProperty('--dy',dy*scale+'px');status.textContent='Joystick: '+Math.round(dx*scale/lim*100)+'%, '+Math.round(dy*scale/lim*100)+'%'}stick.addEventListener('pointerdown',e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);move(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))move(e)});for(const event of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(event,center);
</script></body></html>
