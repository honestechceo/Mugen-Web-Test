*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b13;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;padding:5px;z-index:2;pointer-events:none}.health{width:34%;height:17px;background:#341c25;border:2px solid #c8a45b;border-radius:5px;overflow:hidden}.health div{height:100%;width:100%;background:linear-gradient(90deg,#62d18e,#b9e66d);transition:width .12s}.health.right div{margin-left:auto}.timer{font-weight:900;color:#e8c16b;font-size:22px;text-shadow:1px 2px #000}#names{position:fixed;top:calc(env(safe-area-inset-top) + 27px);left:12%;right:12%;display:flex;justify-content:space-between;font-weight:900;font-size:clamp(10px,1.5vw,16px);text-shadow:1px 2px #000;pointer-events:none}.controls{position:fixed;inset:0;pointer-events:none;z-index:3}.pad{position:absolute;left:max(2%,env(safe-area-inset-left));bottom:max(6%,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,clamp(43px,8vw,70px));grid-template-rows:repeat(2,clamp(43px,8vw,70px));gap:4px}.attacks{position:absolute;right:max(3%,env(safe-area-inset-right));bottom:max(7%,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,clamp(43px,7vw,66px));grid-template-rows:repeat(2,clamp(43px,7vw,66px));gap:6px}.controls button{pointer-events:auto;background:#121a2bd9;border:2px solid #d7ad52;border-radius:50%;color:white;font-weight:900;font-size:clamp(12px,2vw,18px);touch-action:none;user-select:none;-webkit-user-select:none}.controls button.down{background:#d7ad52;color:#10121a}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .jump{grid-column:2;grid-row:1}.pad .block{grid-column:2;grid-row:2}.attacks button{border-color:#8caee9}.topbar{position:fixed;z-index:5;top:calc(env(safe-area-inset-top) + 47px);right:max(10px,env(safe-area-inset-right));display:flex;gap:5px}.topbar button,.overlay button{border:1px solid #d7ad52;background:#1c2534;color:#fff;padding:7px 11px;border-radius:8px;font-weight:800}.overlay{position:fixed;inset:0;z-index:10;background:#080d18e8;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.panel{max-width:500px;border:2px solid #d7ad52;border-radius:16px;background:#182338;padding:22px;box-shadow:0 10px 50px #000b}.panel h1{margin:0 0 8px;color:#e5bd67;font-size:clamp(22px,5vw,40px)}.panel p{line-height:1.45;color:#d9e0ef}.panel button{font-size:18px;background:#a78039;color:#0a0e16;padding:12px 25px}.panel a{color:#eac97d;display:block;margin-top:14px}.hidden{display:none}@media(orientation:portrait){.panel:before{content:"Rotate your iPhone to landscape for best gameplay.";display:block;color:#eac97d;margin-bottom:10px}.pad{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}.attacks{grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px)}}
html,body,button,canvas{touch-action:manipulation;-webkit-tap-highlight-color:transparent}button{user-select:none;-webkit-user-select:none}.arena,.joystick,.attack,.utility,.controls,.controls button,#game{touch-action:none}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="health"><div id="hp1"></div></div><div class="timer" id="clock">60</div><div class="health right"><div id="hp2"></div></div></div><div id="names"><span>HONESTECH HERO</span><span>IRON RIVAL</span></div><div class="topbar"><button id="pause">PAUSE</button><button id="restart">RESTART</button></div><div class="controls"><div class="pad"><button class="left" data-key="left">◀</button><button class="right" data-key="right">▶</button><button class="jump" data-key="jump">▲</button><button class="block" data-key="block">GUARD</button></div><div class="attacks"><button data-key="punch">P</button><button data-key="kick">K</button><button data-key="heavy">H</button><button data-key="special">SP</button><button data-key="punch">X</button><button data-key="kick">Y</button></div></div><div class="overlay" id="overlay"><div class="panel"><h1 id="headline">HONESTECH MUGEN</h1><p id="message">Playable browser fighting prototype. Move, jump, guard and fight the computer opponent. Touch controls work on iPhone; keyboard: arrows/WASD, J punch, K kick, L heavy, U special, Shift guard.</p><button id="play">START FIGHT</button><a href="./index.html">Back to Control Lab</a></div></div><script>
'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),headline=document.getElementById('headline'),message=document.getElementById('message'),clock=document.getElementById('clock'),hp1=document.getElementById('hp1'),hp2=document.getElementById('hp2');let W=960,H=540,scale=1,playing=false,paused=false,remaining=60,last=0,aiCooldown=0,shake=0,round=0;const held=new Set();const actions={punch:{damage:7,reach:83,duration:.23,cooldown:.32},kick:{damage:10,reach:106,duration:.32,cooldown:.48},heavy:{damage:16,reach:97,duration:.43,cooldown:.73},special:{damage:22,reach:155,duration:.5,cooldown:1.4}};function fighter(x,color,trim){return{x,y:0,vx:0,vy:0,hp:100,face:1,color,trim,action:null,attackTime:0,cooldown:0,hit:false,stun:0,guard:false}}let p=fighter(270,'#bd343d','#efb85a'),enemy=fighter(690,'#485c82','#d4dbe9');function resize(){const d=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(innerWidth*d);canvas.height=Math.round(innerHeight*d);canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';W=960;H=540;ctx.setTransform(canvas.width/W,0,0,canvas.height/H,0,0)}window.addEventListener('resize',resize);resize();function reset(){p=fighter(260,'#bd343d','#efb85a');enemy=fighter(700,'#485c82','#d4dbe9');enemy.face=-1;remaining=60;aiCooldown=.8;shake=0;round++;held.clear();playing=true;paused=false;overlay.classList.add('hidden');last=performance.now();requestAnimationFrame(loop)}function finish(text){playing=false;headline.textContent=text;message.textContent='Round '+round+' complete. Fight again?';document.getElementById('play').textContent='REMATCH';overlay.classList.remove('hidden')}document.getElementById('play').onclick=reset;document.getElementById('restart').onclick=reset;document.getElementById('pause').onclick=()=>{if(!playing)return;paused=!paused;document.getElementById('pause').textContent=paused?'RESUME':'PAUSE';if(!paused){last=performance.now();requestAnimationFrame(loop)}};document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(key);b.classList.add('down');if(actions[key])attack(p,key)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{held.delete(key);b.classList.remove('down')})});const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'left',d:'right',w:'jump',j:'punch',k:'kick',l:'heavy',u:'special',Shift:'block'};window.addEventListener('keydown',e=>{const k=map[e.key];if(k){e.preventDefault();held.add(k);if(actions[k]&&!e.repeat)attack(p,k)}});window.addEventListener('keyup',e=>{const k=map[e.key];if(k)held.delete(k)});window.addEventListener('blur',()=>held.clear());function attack(f,key){if(!playing||paused||f.cooldown>0||f.stun>0)return;const a=actions[key];f.action=key;f.attackTime=a.duration;f.cooldown=a.cooldown;f.hit=false}function updateF(f,dt,player){f.cooldown=Math.max(0,f.cooldown-dt);f.stun=Math.max(0,f.stun-dt);f.attackTime=Math.max(0,f.attackTime-dt);if(f.attackTime===0)f.action=null;f.face=(player?enemy:p).x>f.x?1:-1;f.guard=player?held.has('block'):f.guard;let dir=0;if(player){dir=(held.has('right')?1:0)-(held.has('left')?1:0);if(held.has('jump')&&f.y===0){f.vy=550}}else if(f.stun===0){const dist=Math.abs(p.x-f.x);if(dist>105)dir=f.face;else if(dist<55)dir=-f.face}if(f.stun===0&&!f.guard)f.x+=dir*(f.action?90:225)*dt;f.x=Math.max(35,Math.min(925,f.x));f.y=Math.max(0,f.y+f.vy*dt);f.vy-=1250*dt;if(f.y===0)f.vy=0;if(f.action&&!f.hit){const other=player?enemy:p,a=actions[f.action];if(Math.abs(other.x-f.x)<a.reach&&Math.abs(other.y-f.y)<105&&Math.sign(other.x-f.x)===f.face){f.hit=true;const damage=other.guard?Math.ceil(a.damage*.2):a.damage;other.hp=Math.max(0,other.hp-damage);other.stun=other.guard?.06:.2;other.x=Math.max(35,Math.min(925,other.x+f.face*(other.guard?8:22)));shake=.08}}}function update(dt){remaining=Math.max(0,remaining-dt);updateF(p,dt,true);aiCooldown-=dt;if(aiCooldown<=0){enemy.guard=Math.random()<.25;if(Math.abs(p.x-enemy.x)<155)attack(enemy,Math.random()<.5?'punch':'kick');aiCooldown=.35+Math.random()*.6}updateF(enemy,dt,false);shake=Math.max(0,shake-dt);hp1.style.width=p.hp+'%';hp2.style.width=enemy.hp+'%';clock.textContent=Math.ceil(remaining);if(p.hp<=0||enemy.hp<=0||remaining<=0){finish(p.hp===enemy.hp?'DRAW':p.hp>enemy.hp?'YOU WIN!':'RIVAL WINS')}}function drawF(f){const ground=435,cy=ground-f.y;ctx.save();ctx.translate(f.x,cy);ctx.scale(f.face,1);ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,8,38,9,0,0,7);ctx.fill();ctx.lineWidth=6;ctx.strokeStyle='#10121a';ctx.fillStyle=f.color;ctx.fillRect(-24,-108,48,70);ctx.strokeRect(-24,-108,48,70);ctx.fillStyle=f.trim;ctx.fillRect(-23,-105,46,10);ctx.fillStyle='#2b303c';ctx.fillRect(-22,-40,18,42);ctx.fillRect(7,-40,18,42);ctx.fillStyle='#e6b98b';ctx.beginPath();ctx.arc(0,-132,23,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#171b22';ctx.fillRect(7,-137,10,5);ctx.strokeStyle=f.color;ctx.lineWidth=17;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-22,-95);ctx.lineTo(-38,-60);ctx.moveTo(23,-95);ctx.lineTo(f.action?70:-0,-72);ctx.stroke();if(f.action){ctx.fillStyle='#f6d87999';ctx.beginPath();ctx.arc(75,-75,18,0,Math.PI*2);ctx.fill()}if(f.guard){ctx.strokeStyle='#8ad5f8a9';ctx.lineWidth=7;ctx.beginPath();ctx.arc(0,-75,75,-1.3,1.3);ctx.stroke()}ctx.restore()}function render(){ctx.clearRect(0,0,W,H);ctx.save();if(shake)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*5);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#101e39');bg.addColorStop(.7,'#395276');bg.addColorStop(1,'#172035');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='#f1c97628';ctx.beginPath();ctx.arc(750,115,90,0,Math.PI*2);ctx.fill();for(let i=0;i<12;i++){const x=i*100;ctx.fillStyle=i%2?'#16283e':'#1c3047';ctx.fillRect(x,185+(i%3)*16,90,240)}ctx.fillStyle='#18212d';ctx.fillRect(0,435,W,105);ctx.fillStyle='#bca16b';ctx.fillRect(0,433,W,5);for(let i=0;i<12;i++){ctx.fillStyle='#d4ba7444';ctx.fillRect(i*95,480,40,3)}drawF(p);drawF(enemy);ctx.restore();ctx.font='900 22px system-ui';ctx.textAlign='center';ctx.fillStyle='#e8c16b';ctx.fillText('HONESTECH MUGEN • BROWSER FIGHT',480,88)}function loop(t){if(!playing||paused)return;const dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);render();if(playing)requestAnimationFrame(loop)}render();
document.addEventListener('dblclick',function(e){if(e.target.closest('button,canvas,.arena,.joystick,.controls'))e.preventDefault()},{passive:false});</script></body></html>
